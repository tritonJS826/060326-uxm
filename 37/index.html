<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <form class="container" action="/" method="post">
        <label for="number">Number: </label>
        <input type="number" disabled name="age" min="1" max="100" id="number" step="0.02" required value="98" placeholder="777">
    
        <label for="date">Date:</label>
        <input type="date" name="birthday" id="date">
    
    
        <input type="color" name="favcolor">
    
        <label for="file">File:</label>
        <input type="file" name="avatar" id="file" multiple>

        <input type="submit">
        <input type="button">

        <input type="reset" value="Сбросить!!">
        <input type="text" size="5" name="text-size">

        <input type="hidden" name="session_id" value="12345">


    </form>



</body>
</html>
