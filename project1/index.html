<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="header">
        <div class="header-left">
          <img src="./media/logo.svg" alt="logo" class="logo" />
          <div class="navigation-buttons">
            <button class="navigation-button">Ride</button>
            <button class="navigation-button">Drive</button>
            <button class="navigation-button">Business</button>
            <button class="navigation-button">Uber Eats</button>
            <button class="navigation-button">About</button>
          </div>
        </div>
        <div class="header-right">
          <div class="header-right-regular">
            <button class="header-right-regular-button">EN</button>
            <button class="header-right-regular-button">Help</button>
            <button class="header-right-regular-button">Log In</button>
          </div>
          <button class="header-right-sign-up">Sign Up</button>
        </div>
      </header>

      <div class="hero">
        <div class="heroDescription">
          <h1 class="heroDescriptionTitle">Your ride, whenever you need it.</h1>
          <p class="heroDescriptionText">
            From quick trips to the airport to late-night rides home — get a
            safe, reliable taxi at the tap of a button.
          </p>
          <button class="heroDescriptionButton">Book a ride</button>
        </div>
        <img src="./media/heroImage.jpg" alt="heroImage" class="heroImage" />
      </div>
    </div>
  </body>
</html>
