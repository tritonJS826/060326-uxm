<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span class="logo">🎄</span>
        <nav>
            <a href="index.html">Главная</a>
            <a href="page2.html">Страница 2</a>
            <a href="page3.html">Страница 3</a>
            <a href="page4.html">Страница 4</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Лес</h1>
        <div class="garland"></div>
    </section>
    <section class="empty">
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="tree1.jpg" alt="Ёлка 1"></div>
                <div class="swiper-slide"><img src="tree2.jpg" alt="Ёлка 2"></div>
                <div class="swiper-slide"><img src="tree3.jpg" alt="Ёлка 3"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </section>
    
    <footer>
        <span class="blink-tree">🎄</span>
        <a href="https://google.com" target="_blank">Google</a>
        <span class="blink-tree">🎄</span>
        <button id="newYearBtn" class="new-year-btn">🎄 Новогоднее настроение</button>
    </footer>

    <section class="empty">
        <div class="swiper-2">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="tree1.jpg" alt="Ёлка 3"></div>
                <div class="swiper-slide"><img src="tree2.jpg" alt="Ёлка 2"></div>
                <div class="swiper-slide"><img src="tree3.jpg" alt="Ёлка 3"></div>
            </div>
            <div class="swiper-pagination-2"></div>
            <div class="swiper-button-prev-2"></div>
            <div class="swiper-button-next-2"></div>
        </div>
    </section>

    <audio id="bgMusic" loop preload="auto">
        <source src="christmas.mp3" type="audio/mpeg">
    </audio>
    <div class="snowflakes"></div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
